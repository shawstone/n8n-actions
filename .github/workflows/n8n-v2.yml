name: n8n information aggregator v2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run skips Feishu and state writes; publish sends and persists"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
  schedule:
    # 09:00 Asia/Shanghai = 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: n8n-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'schedule' || vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
      STATE_DIR: ${{ github.workspace }}/.n8n-state
      N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.47.4
      N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
      FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
      DRY_RUN_LIMIT: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Restore n8n state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_DIR }}
          key: n8n-state-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            n8n-state-v2-${{ github.ref_name }}-

      - name: Execute n8n workflow
        run: |
          python3 scripts/validate-project.py
          bash scripts/run-v2.sh "$MODE"

      - name: Save n8n state
        if: always() && hashFiles('.n8n-state/data/database.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_DIR }}
          key: n8n-state-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Render HTML report
        if: always() && hashFiles('artifacts/n8n-v2/run-summary.json') != ''
        run: |
          python3 scripts/render_report.py \
            --summary artifacts/n8n-v2/run-summary.json \
            --output-dir site

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-v2-summary-${{ github.run_id }}
          path: |
            artifacts/n8n-v2/
            site/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        if: env.MODE == 'publish'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: env.MODE == 'publish'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        if: env.MODE == 'publish'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Archive report to Cloudflare R2
        if: env.MODE == 'publish'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets are not configured; skipping archive."
            exit 0
          fi

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          report_day="$(TZ=Asia/Shanghai date +%F)"
          report_time="$(TZ=Asia/Shanghai date +%H-%M-%S)"
          archive_prefix="s3://${R2_BUCKET}/n8n-v2/${report_day}/${report_time}"

          for filename in index.html report.json; do
            aws s3 cp "site/${filename}" "${archive_prefix}/${filename}" \
              --endpoint-url "$endpoint" \
              --content-type "$([ "$filename" = index.html ] && echo 'text/html; charset=utf-8' || echo 'application/json; charset=utf-8')"
            aws s3 cp "site/${filename}" "s3://${R2_BUCKET}/n8n-v2/latest/${filename}" \
              --endpoint-url "$endpoint" \
              --content-type "$([ "$filename" = index.html ] && echo 'text/html; charset=utf-8' || echo 'application/json; charset=utf-8')"
          done
