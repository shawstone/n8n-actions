name: n8n RSS dry run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .phase2/run-request

permissions:
  contents: read

concurrency:
  group: n8n-rss-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.47.4
      WORKFLOW_ID: SDbEpCrT1vf0m3gr
      EXPECTED_WORKFLOW_SHA256: 492A6C99A7AF6AC71D8AD45017DB4FF1D907881672D323DC7D521B17BB4F28EF
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run public RSS and DeepSeek dry run
        run: bash scripts/run-rss-dry-run.sh

      - name: Upload dry-run preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-rss-dry-run
          path: dry-run/
          if-no-files-found: warn
          retention-days: 3
