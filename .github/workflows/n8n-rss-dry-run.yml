name: n8n RSS report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - .phase2/run-request

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: n8n-rss-dry-run
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.47.4
      WORKFLOW_ID: SDbEpCrT1vf0m3gr
      EXPECTED_WORKFLOW_SHA256: 492A6C99A7AF6AC71D8AD45017DB4FF1D907881672D323DC7D521B17BB4F28EF
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run public RSS and DeepSeek report
        run: bash scripts/run-rss-dry-run.sh

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p site
          cp dry-run/index.html site/index.html
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Archive report to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::R2 secrets are not configured; skipping archive."
            exit 0
          fi

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          report_day="$(TZ=Asia/Shanghai date +%F)"
          report_time="$(TZ=Asia/Shanghai date +%H-%M-%S)"
          archive_prefix="s3://${R2_BUCKET}/reports/${report_day}/${report_time}"

          aws s3 cp dry-run/index.html "${archive_prefix}/index.html" \
            --endpoint-url "$endpoint" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dry-run/report.json "${archive_prefix}/report.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8"
          aws s3 cp dry-run/index.html "s3://${R2_BUCKET}/reports/latest/index.html" \
            --endpoint-url "$endpoint" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dry-run/report.json "s3://${R2_BUCKET}/reports/latest/report.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json; charset=utf-8"

      - name: Upload downloadable report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-rss-report
          path: dry-run/
          if-no-files-found: warn
          retention-days: 3
