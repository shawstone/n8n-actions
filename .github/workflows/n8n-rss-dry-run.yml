name: n8n RSS report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .phase2/run-request

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: n8n-rss-dry-run
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.47.4
      WORKFLOW_ID: SDbEpCrT1vf0m3gr
      EXPECTED_WORKFLOW_SHA256: 492A6C99A7AF6AC71D8AD45017DB4FF1D907881672D323DC7D521B17BB4F28EF
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run public RSS and DeepSeek dry run
        run: bash scripts/run-rss-dry-run.sh

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p site
          cp dry-run/index.html site/index.html
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload downloadable dry-run files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-rss-dry-run
          path: dry-run/
          if-no-files-found: warn
          retention-days: 3
